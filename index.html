<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CRUD</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <section class="w-50 my-5 mx-auto">
      <label for="productName">Product Name</label>
      <input
        type="text"
        placeholder="Product Name ...."
        id="productName"
        class="form-control mb-3"
      />

      <label for="productPrice">Product Price</label>
      <input
        type="number"
        placeholder="Product Price ...."
        id="productPrice"
        class="form-control mb-3"
      />

      <label for="productCategory">Product Category</label>
      <input
        type="text"
        placeholder="Product Category ...."
        id="productCategory"
        class="form-control mb-3"
      />

      <label for="productImg">Product Img</label>
      <input
        type="file"
        placeholder="Product Img ...."
        id="productImg"
        class="form-control mb-3"
      />

      <label for="productDesc">Product Desc</label>
      <textarea name="" id="productDesc" class="form-control mb-3"></textarea>
      <button class="btn btn-outline-success w-100" onclick="addProduct()">
        ADD PRODUCT
      </button>
    </section>

    <section class="w-75 mx-auto my-5">
      <table class="table table-striped">
        <thead>
          <tr>
            <th>Index</th>
            <th>Image</th>
            <th>Name</th>
            <th>Price</th>
            <th>Category</th>
            <th>Desc</th>
          </tr>
        </thead>
        <tbody id="demo">

        </tbody>
      </table>
    </section>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"
    ></script>
    <script src="./js/main.js"></script>
  </body>
</html>
